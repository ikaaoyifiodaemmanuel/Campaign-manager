services:
  # ── Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campaign-net
    healthcheck:
      # -d is required — without it pg_isready defaults to probing a database
      # named after the USER ("campaign"), not POSTGRES_DB
      # ("campaign_manager"), which doesn't exist and logs a harmless but
      # noisy FATAL every interval. Cosmetic only: pg_isready still reports
      # healthy either way (a "database does not exist" response proves the
      # server is accepting connections), so this never affected anything —
      # just silences log spam.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - campaign-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage (Phase 3 of the SaaS conversion — see
  # ~/.claude/plans/ok-lets-go-with-stateful-balloon.md) standing in for
  # DigitalOcean Spaces locally. Spaces speaks the same S3 API, so
  # api-gateway/worker's S3 SDK calls need zero code changes to point at a
  # real Spaces bucket later — only S3_ENDPOINT/credentials change (see
  # .env.example). Not something publisher-service or any other host
  # process needs to run — only these two containers write to it.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '9000:9000' # S3 API — also what the host (browser, publisher-service) reaches it at
      - '9001:9001' # web console, dev convenience only
    volumes:
      - minio_data:/data
    networks:
      - campaign-net
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── TypeScript Services ─────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - campaign-net
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # ── Python FastAPI Services ─────────────────────────────────────────────
  media-service:
    build:
      context: ./apps/media-service
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - campaign-net
    restart: unless-stopped
    healthcheck:
      # Reports healthy only once entrypoint.sh's `alembic upgrade head` has
      # finished and uvicorn is actually serving — orchestrator/worker below
      # depend on this (not just postgres) precisely so they never query
      # tables a still-migrating media-service hasn't created yet. No curl
      # in this image; a stdlib urllib check needs no extra install.
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  content-service:
    build:
      context: ./apps/content-service
      dockerfile: Dockerfile
    ports:
      - '5002:5002'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campaign-net
    restart: unless-stopped

  # publisher-service runs LOCALLY on the host, not in Docker — see docs/setup.md.
  # It needs to use the exact same browser/OS environment that the one-time
  # Twitter login ran in (real Chrome, same machine); a session created on the
  # host and then presented from a Linux container gets silently invalidated
  # by X's device-fingerprint checks, independent of any automation detection.
  # On Windows + WSL2, this means running it as a native Windows process (not
  # inside WSL2) — see docs/setup.md's "Windows + WSL2" section.
  # Run it with: cd apps/publisher-service && source .venv/bin/activate && uvicorn app:app --port 5003
  #
  # The extra_hosts entries above (api-gateway, worker, orchestrator) are what
  # let those containers reach it at host.docker.internal:5003 — Docker
  # Desktop sets this up automatically, but a raw Docker Engine install inside
  # WSL2 (no Docker Desktop) does not, hence the explicit host-gateway entries.

  analytics-service:
    build:
      context: ./apps/analytics-service
      dockerfile: Dockerfile
    ports:
      - '5004:5004'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campaign-net
    restart: unless-stopped

  # ── Python Background Processes (no HTTP ports) ─────────────────────────
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      media-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - campaign-net
    restart: unless-stopped
    volumes:
      # Canva-designed card template frames for the quote/slideshow streams
      # (see assets/templates/README.md) — bind-mounted so a template refresh
      # never needs an image rebuild. No longer bind-mounts ./uploads — final
      # artifacts go to S3-compatible storage now (see pipeline/storage.py);
      # local disk is pure ffmpeg scratch space (tmp_path), not shared state.
      - ./assets/templates:/templates:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  orchestrator:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - campaign-net
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # ── Frontend ────────────────────────────────────────────────────────────
  # web — Next.js dev server, containerized so `docker compose up` covers
  # everything except publisher-service (see the comment above it). Source
  # is bind-mounted for live hot-reload; node_modules/.next are separate
  # anonymous volumes so the container's own (Linux) install isn't shadowed
  # by whatever's in ./apps/web/node_modules on the host (e.g. macOS-built
  # native deps) if you've also run `npm install` there directly. Nothing
  # is deployed anywhere — this is still local-only, just one container
  # instead of a separate `npm run dev` — see docs/web.md.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '3006:3006'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      # Docker Desktop's bind-mount file events don't always reach the Linux
      # VM's inotify reliably — polling makes hot-reload dependable at the
      # cost of a bit of CPU.
      - WATCHPACK_POLLING=true
    depends_on:
      - api-gateway
    networks:
      - campaign-net
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  campaign-net:
    driver: bridge
